<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>JOBS_NORTH | Agent</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "outline": "#8d919a","on-tertiary-container": "#465468","on-tertiary": "#233144",
            "primary-fixed": "#e0e3e5","surface-container-highest": "#353534","on-background": "#e5e2e1",
            "tertiary-fixed": "#d5e3fd","secondary-container": "#234a79","on-error": "#690005",
            "error": "#ffb4ab","surface-bright": "#393939","inverse-on-surface": "#313030",
            "surface-dim": "#131313","inverse-primary": "#5c5f61","on-error-container": "#ffdad6",
            "surface-container-low": "#1c1b1b","outline-variant": "#43474f","on-primary": "#2d3133",
            "on-surface": "#e5e2e1","surface": "#131313","secondary": "#a5c9fe","surface-tint": "#c4c7c9",
            "secondary-fixed": "#d4e3ff","error-container": "#93000a","secondary-fixed-dim": "#a5c9fe",
            "primary-fixed-dim": "#c4c7c9","on-tertiary-fixed-variant": "#3a485c",
            "surface-container-lowest": "#0e0e0e","on-secondary-container": "#96baf0",
            "on-secondary": "#00315d","on-secondary-fixed": "#001c39","primary": "#e1e3e5",
            "tertiary": "#d5e4fd","surface-variant": "#353534","inverse-surface": "#e5e2e1",
            "background": "#131313","on-primary-container": "#505355","surface-container-high": "#2a2a2a",
            "tertiary-container": "#b9c8e1","on-primary-fixed-variant": "#444749",
            "surface-container": "#201f1f","on-primary-fixed": "#191c1e",
            "on-secondary-fixed-variant": "#204876","primary-container": "#c5c7c9",
            "on-surface-variant": "#c3c6d0","on-tertiary-fixed": "#0d1c2f","tertiary-fixed-dim": "#b9c7e0"
          },
          fontFamily: { "headline": ["Manrope"], "body": ["Inter"], "label": ["Space Grotesk"] },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { background-color: #131313; color: #e5e2e1; min-height: 100dvh; animation: fadeIn 200ms ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="font-body selection:bg-secondary/30">

<header class="fixed top-0 w-full z-50 bg-[#131313]/70 backdrop-blur-xl flex justify-between items-center px-6 py-4">
  <div class="flex items-center gap-4">
    <h1 class="text-2xl font-black tracking-tighter text-[#E1E3E5] font-headline uppercase">JOBS_NORTH</h1>
    <span class="font-label text-xs uppercase tracking-widest text-secondary">Agent v2</span>
  </div>
  <nav class="hidden md:flex items-center gap-8">
    <a class="text-[#E1E3E5] border-b-2 border-[#E1E3E5] font-headline tracking-tighter font-bold uppercase py-1" href="index.html">Agent</a>
    <a class="text-[#C5C7C9] hover:bg-[#C5C7C9]/10 transition-colors font-headline tracking-tighter font-bold uppercase py-1 relative" href="saved.html">Saved
      <span id="saved-badge-desktop" class="hidden ml-1 inline-flex items-center justify-center w-4 h-4 text-[9px] font-bold bg-secondary text-on-secondary rounded-full"></span>
    </a>
  </nav>
</header>

<main class="pt-32 pb-24 max-w-4xl mx-auto px-6">
  <section id="agent-interface" class="mb-12">
    <h2 class="text-5xl md:text-7xl font-headline font-extrabold tracking-tighter leading-none mb-4">
      Task your agent.
    </h2>
    <p class="font-label text-outline uppercase tracking-widest text-sm max-w-md mb-6">
      Describe your ideal role in plain English. Your agent will find the closest matches.
    </p>
    <div class="flex flex-col gap-4">
      <textarea id="agent-query" class="w-full bg-surface-container-lowest border border-outline-variant/30 focus:ring-secondary focus:border-secondary font-body text-base p-4" rows="3" placeholder="e.g., A creative role in Toronto that values writing and design."></textarea>
      <button id="task-agent-btn" class="w-full md:w-auto self-start font-label text-sm uppercase tracking-widest py-3 px-8 bg-secondary text-on-secondary hover:bg-secondary/80 transition-colors disabled:bg-outline-variant disabled:cursor-not-allowed">
        Task Agent
      </button>
    </div>
    <div id="agent-status" class="mt-4 font-label text-xs uppercase tracking-widest text-outline-variant"></div>
  </section>

  <section id="results-section">
    <h3 class="font-headline text-3xl font-bold tracking-tighter mb-6">Agent's Findings_</h3>
    <div id="jobs-container" class="flex flex-col gap-12">
      <!-- Job results will be rendered here -->
    </div>
  </section>
</main>

<script type="module">
  import { initializeAgent, findSimilarJobs, renderCard, renderSkeleton, getSavedCount } from './jobs-data.js';

  const agentQueryEl = document.getElementById('agent-query');
  const taskAgentBtn = document.getElementById('task-agent-btn');
  const agentStatusEl = document.getElementById('agent-status');
  const container = document.getElementById('jobs-container');
  const savedBadgeDesktop = document.getElementById('saved-badge-desktop');

  function updateSavedBadge() {
    const count = getSavedCount();
    if (savedBadgeDesktop) {
      savedBadgeDesktop.textContent = count;
      savedBadgeDesktop.classList.toggle('hidden', count === 0);
    }
  }

  function setAgentStatus(status, isWorking = false) {
    agentStatusEl.textContent = status;
    taskAgentBtn.disabled = isWorking;
  }

  taskAgentBtn.addEventListener('click', async () => {
    const query = agentQueryEl.value.trim();
    if (!query) return;

    setAgentStatus('Searching...', true);
    container.innerHTML = renderSkeleton(3);

    try {
      const jobs = await findSimilarJobs(query, 5);
      
      container.innerHTML = '';
      if (jobs.length === 0) {
        container.innerHTML = `<p class="font-label text-outline">No relevant jobs found for your query.</p>`;
        return;
      }

      jobs.forEach(job => {
        const wrap = document.createElement('div');
        wrap.innerHTML = renderCard(job);
        const card = wrap.firstElementChild;
        card.addEventListener('click', () => {
          sessionStorage.setItem('jobs_north_current', JSON.stringify(job));
          window.location.href = `detail.html?id=${encodeURIComponent(job.id)}`;
        });
        container.appendChild(card);
      });

      setAgentStatus('Top 5 matches found.', false);
    } catch (error) {
      console.error(error);
      setAgentStatus('An error occurred.', false);
      container.innerHTML = `<p class="font-label text-error">Error: Could not perform search.</p>`;
    }
  });

  async function init() {
    updateSavedBadge();
    setAgentStatus('Agent is offline.', true);
    container.innerHTML = `<p class="font-label text-outline">Agent is initializing. This may take a moment...</p>`;
    
    try {
      await initializeAgent(status => setAgentStatus(status, true));
      setAgentStatus('Agent is ready. Task me.', false);
      container.innerHTML = `<p class="font-label text-outline">Awaiting your command.</p>`;
    } catch (error) {
      console.error(error);
      setAgentStatus('Agent failed to initialize.', true);
      container.innerHTML = `<p class="font-label text-error">Critical Error: AI Agent could not start.</p>`;
    }
  }

  init();
</script>
</body>
</html>
